<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Book Record</title>
  <link rel="stylesheet" href="/assets/auth.css">
  <script src="/assets/auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <p class="eyebrow">BOOK RECORD</p>
    <h1>Create your account</h1>
    <p class="muted">Register to access the book collection.</p>
    <form data-auth-form="register">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
      <p class="hint">Use 12–72 characters. A longer passphrase is a good choice.</p>
      <button type="submit">Create account</button>
      <p class="message" role="status" aria-live="polite"></p>
    </form>
    <p class="footer">Already registered? <a href="/login">Sign in</a></p>
  </main>
</body>
</html>
